<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>18 transformaciones</title>
</head>
<body>
    <nav class="bg-violet-600 flex justify-between items-center p-4 inset-x-0 top-0 w-full fixed z-10">
        <h1 class="text-3xl text-white font-bold">Logo.</h1>
        <div class="text-white flex space-x-4 text-lg">
            <a href="">Inicio</a>
            <a href="">Acerca de</a>
            <a href="">Contactanos</a>
        </div>
    </nav>

    <figure class="w-64 h-96 relative top-40 left-20">
        <img src="https://www.hd-tecnologia.com/imagenes/articulos/2022/05/TOP-5-mejores-laptops-para-estudiantes-en-2022-1.jpg"
            class="w-full h-full object-cover relative scale-50 origin-left" alt="">
            <!-- scale-y-50 rotate-45 translate-x-10 skew-x-6 skew-y-2 origin-top-->
        <p class="absolute inset-0 text-white bg-red-600/50 flex items-center justify-center font-bold text-3xl z-1">Soy un
            texto</p>
    </figure>

    <div class="mt-72">
        pseudoclases
    </div>

    <figure class="w-64 h-96 relative top-40 left-20">
        <img src="https://www.hd-tecnologia.com/imagenes/articulos/2022/05/TOP-5-mejores-laptops-para-estudiantes-en-2022-1.jpg"
            class="w-full h-full object-cover relative scale-50 origin-left target:scale-150 z-20" alt="" id="img">
        <!-- hover: cuando paso el mouse, active:al hacer click, target:referente a un id -->
        <p class="absolute inset-0 text-white bg-red-600/50 flex items-center justify-center font-bold text-3xl z-1">Soy un
            texto</p>
    </figure>

    <hr class="mt-40">
    <a href="#img" class="bg-red-300 p-8 block">volver grande la Imagen con target</a>
    <a href="#" class="bg-red-300 p-8 block">quitar target</a>

    <div class="my-4 text-2xl font-bold text-center">
        pseudoclases focus
    </div>

    <form action="" class="focus-within:bg-red-600">
        <input placeholder="Ingresa tu nombre" class="border border-black p-8 mx-auto block my-8 focus:bg-red-400 focus:placeholder:text-white focus:text-white" type="text" name="" id="">
    </form>

    <div class="my-4 text-2xl font-bold text-center">
        pseudoclases focus
    </div>
    
    <form action="" class="">
        <input placeholder="Ingresa tu nombre" class="border border-black p-8 mx-auto block my-8 placeholder-shown:bg-amber-300" type="text" name="" id="">
        <input type="checkbox" class="w-24 h-24 mx-auto block my-8 checked:w-86 checked:h-86" name="" id="">
    </form>
</body>
</html>
